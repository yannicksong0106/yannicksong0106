name: refresh-stats

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch live stats
        run: node scripts/fetch-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild hero cards
        run: node scripts/build-hero.mjs

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "no changes"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero-dark.svg assets/hero-light.svg scripts/stats.json README.md
          git commit -m "chore: refresh stats $(date -u +%Y-%m-%d)"
          git push
